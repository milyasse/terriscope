name: CI
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: terriscope_test
          POSTGRES_USER: terriscope
          POSTGRES_PASSWORD: mot-de-passe-de-test-uniquement
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U terriscope" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer les dépendances
        run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Tests de l'API sur PostGIS
        run: npm run test:api
        env:
          DATABASE_URL: postgres://terriscope:mot-de-passe-de-test-uniquement@localhost:5432/terriscope_test
      - run: npm run build
      - name: Vérifier la configuration Docker et construire l'image de l'API
        run: |
          POSTGRES_PASSWORD=x docker compose config --quiet
          docker build -f Dockerfile.api -t terriscope-api .
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Parcours de bout en bout
        run: |
          npm run preview &
          npx --yes wait-on@8 http://localhost:4173/
          npm run e2e
      - name: Conserver captures et verrou de dépendances
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: |
            artifacts/screens
            package-lock.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publier les captures sur la branche ci-captures
        if: always() && github.event_name == 'push'
        run: |
          [ -d artifacts/screens ] || exit 0
          rm -rf /tmp/captures && mkdir -p /tmp/captures && cp -r artifacts/screens/. /tmp/captures/ && cp package-lock.json /tmp/captures/ || true
          cd /tmp/captures
          git init -q -b ci-captures
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Captures de ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-captures
        env:
          GITHUB_TOKEN: ${{ github.token }}
