name: CI
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer les dépendances
        run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Parcours de bout en bout
        run: |
          npm run preview &
          npx --yes wait-on@8 http://localhost:4173/
          npm run e2e
      - name: Conserver captures et verrou de dépendances
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: |
            artifacts/screens
            package-lock.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publier les captures sur la branche ci-captures
        if: always() && github.event_name == 'push'
        run: |
          [ -d artifacts/screens ] || exit 0
          rm -rf /tmp/captures && mkdir -p /tmp/captures && cp -r artifacts/screens/. /tmp/captures/ && cp package-lock.json /tmp/captures/ || true
          cd /tmp/captures
          git init -q -b ci-captures
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Captures de ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-captures
        env:
          GITHUB_TOKEN: ${{ github.token }}
